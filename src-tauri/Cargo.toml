[package]
name = "kinesis"
version = "0.4.7"
description = "A desktop application for saving and organizing YouTube video transcripts."
authors = ["William N. Johnson"]
license = "MIT"
repository = "https://github.com/willnjohnson/Kinesis"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = 2
lto = "off"

[features]
default = ["kinesis"]
kinesis = []
genesis = []

# Windows only: the tray icon (its Linux backend would need extra system libraries to build) and clipboard access for
# the tray's quick-save popup.
[target.'cfg(windows)'.dependencies]
tauri = { version = "2.10.2", features = ["tray-icon"] }
arboard = "3"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.2", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["json", "blocking", "gzip", "deflate", "brotli", "cookies"] }
regex = "1.10"
quick-xml = "0.36"
scraper = "0.20"
urlencoding = "2.1.3"
html-escape = "0.2"
tauri-plugin-openurl = "0.1.0-beta.3"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2"
tauri-plugin-localhost = "2"
tiny_http = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
chrono = "0.4"
futures = "0.3"
tokio = { version = "1.49.0", features = ["full"] }
base64 = "0.21"
# Attachments: sha256 for content addressing/integrity, deflate for lossless compression.
sha2 = "0.10"
flate2 = "1"
# One Kinesis window per workspace: an exclusive lock file next to the database.
fs2 = "0.4"
kinesis-sync-proto = { path = "../crates/kinesis-sync-proto", features = ["sqlite"] }

[dev-dependencies]
# The real reference server, so the client engine can be tested end to end against it.
kinesis-sync-server = { path = "../crates/kinesis-sync-server" }
